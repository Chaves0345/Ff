<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<meta name="description" content="Todos os meus links em um só lugar.">
<title>Julia Lopes | Links</title>
<!--
  ╔════════════════════════════════════════════════════════╗
  ║   LINK BIO — modelo estilo Linktree (arquivo único)    ║
  ║   Fundo: céu PRETO estrelado + aurora boreal + gota     ║
  ╚════════════════════════════════════════════════════════╝

  COMO PERSONALIZAR (tudo editável neste arquivo):
  1. Título da aba ......... <title> acima
  2. Foto de perfil ........ embarcada no <img> dentro de <div class="avatar-inner">
                             (a mesma foto está salva como avatar.jpg nesta pasta)
                             — para trocar, coloque sua foto aqui e ajuste o src
  3. Botões ................ Telegram (grupo de prévias), Zangi (meu zangi + botão
                             de copiar número) e WhatsApp (apenas vendas de PACK)
                             — troque o href de cada um na seção <section class="links">
                             (o número copiado fica no atributo data-copy="...")
  4. Cores do tema ......... variáveis --c1, --c2 e --c3 em :root
                             (cores dos ícones dos apps: .ico-tg, .ico-zg e .ico-wa)

  EFEITOS DO FUNDO (canvas + JavaScript no final do arquivo):
  • Céu preto puro com estrelas que piscam (3 profundidades)
  • AURORA BOREAL animada — faixas de luz verde/roxa ondulando no céu
  • Parallax: as estrelas acompanham o mouse/dedo
  • Clique/toque em qualquer lugar = gota d'água (efeito água)
  • No toque, as estrelas fogem para trás e o céu "afunda" levemente
  • Estrelas cadentes de vez em quando
  Para ajustar, edite as constantes no início do script:
  STAR_COUNT, PARALLAX_PX, RIPPLE_SPEED

  COMO PUBLICAR DE GRAÇA:
  • Netlify Drop (netlify.com/drop) — arrasta a pasta e solta
  • GitHub Pages — repositório público + Settings > Pages
  • Neocities, Vercel, Cloudflare Pages...
-->
<style>
  :root{
    --c1:#8b5cf6;  /* roxo — mude para a sua cor */
    --c2:#ec4899;  /* rosa */
    --c3:#38bdf8;  /* azul  */
    --glass:rgba(255,255,255,.07);
    --glass-hover:rgba(255,255,255,.13);
    --line:rgba(255,255,255,.14);
    --muted:rgba(255,255,255,.62);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    min-height:100vh;
    min-height:100svh;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    color:#fff;
    background:#000; /* céu preto puro */
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:rgba(139,92,246,.55)}

  /* ---------- céu estrelado (canvas) ---------- */
  #sky{
    position:fixed;top:0;left:0;z-index:0;
    display:block;pointer-events:none;
  }

  /* ---------- estrutura ---------- */
  .container{position:relative;z-index:2;max-width:480px;margin:0 auto;padding:56px 20px 36px}

  /* animação de entrada */
  .rise{opacity:0;animation:rise .7s cubic-bezier(.22,1,.36,1) forwards}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}

  /* ---------- perfil ---------- */
  header{text-align:center;margin-bottom:34px}
  .avatar{
    width:108px;height:108px;margin:0 auto 18px;border-radius:50%;padding:4px;
    background:linear-gradient(135deg,var(--c1),var(--c2) 55%,var(--c3));
    box-shadow:0 12px 40px rgba(139,92,246,.4);
  }
  .avatar-inner{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#1a1230}
  .avatar-inner img,.avatar-inner svg{width:100%;height:100%;object-fit:cover;display:block}
  .name-row{display:flex;align-items:center;justify-content:center;gap:7px}
  h1{font-size:1.4rem;font-weight:700;letter-spacing:.2px}
  .badge{width:19px;height:19px;flex:none;filter:drop-shadow(0 2px 6px rgba(56,189,248,.5))}

  /* ---------- botões de link ---------- */
  .links{display:grid;gap:14px}
  .link-btn{
    position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;
    padding:15px 18px;border-radius:18px;text-decoration:none;color:#fff;
    font-weight:600;font-size:.98rem;
    background:var(--glass);border:1px solid var(--line);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    transition:transform .22s ease,background .22s ease,border-color .22s ease,box-shadow .22s ease;
  }
  .link-btn:hover{transform:translateY(-3px);background:var(--glass-hover);border-color:rgba(255,255,255,.3);box-shadow:0 14px 34px rgba(0,0,0,.4)}
  .link-btn:active{transform:translateY(-1px) scale(.99)}
  .link-btn:focus-visible{outline:2px solid var(--c3);outline-offset:3px}
  .link-btn .ico{
    flex:none;width:42px;height:42px;border-radius:13px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);
  }
  .link-btn .ico svg{width:22px;height:22px}
  .link-btn .chev{margin-left:auto;width:18px;height:18px;opacity:.5;transition:transform .22s ease,opacity .22s ease}
  .link-btn:hover .chev{transform:translateX(4px);opacity:.9}

  /* ---------- botões de app (Telegram / Zangi / WhatsApp) com efeito ---------- */
  .link-btn.brand{
    --glow:rgba(42,171,238,.45);
    animation:brandPulse 3s ease-in-out infinite;
  }
  .link-btn.brand.zangi{--glow:rgba(39,159,251,.5)}
  .link-btn.brand.wa{--glow:rgba(37,211,102,.45)}
  @keyframes brandPulse{
    0%,100%{box-shadow:0 10px 30px -6px var(--glow)}
    50%{box-shadow:0 16px 46px -4px var(--glow),0 0 26px -8px var(--glow)}
  }
  /* brilho deslizante passando pelo botão */
  .link-btn.brand::after{
    content:'';position:absolute;top:-30%;bottom:-30%;left:-70%;width:45%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.28),transparent);
    transform:skewX(-18deg);animation:shine 3.6s ease-in-out infinite;pointer-events:none;
  }
  .link-btn.brand.zangi::after{animation-delay:1.8s}
  .link-btn.brand.wa::after{animation-delay:.9s}
  @keyframes shine{0%{left:-70%}55%,100%{left:135%}}
  /* tile com a cor oficial de cada app */
  .link-btn .ico{position:relative}
  .link-btn .ico-tg{background:linear-gradient(180deg,#2AABEE,#229ED9);border-color:rgba(255,255,255,.28)}
  .link-btn .ico-zg{background:linear-gradient(180deg,#3FB2FF,#1B8FEF);border-color:rgba(255,255,255,.28)}
  .link-btn .ico-wa{background:linear-gradient(180deg,#2ee06f,#128c7e);border-color:rgba(255,255,255,.28)}
  /* bolinha de "online" no ícone */
  .ico .dot{
    position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;border-radius:50%;
    background:#2ee06f;border:2px solid #0a0d18;animation:dotBlink 2.4s ease-in-out infinite;
  }
  @keyframes dotBlink{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  /* texto do botão em duas linhas */
  .link-btn .lbl{display:flex;flex-direction:column;line-height:1.3}
  .link-btn .lbl small{font-size:.78rem;font-weight:500;color:rgba(255,255,255,.6)}

  /* botão de copiar o número (dentro do botão Zangi) */
  .copy-btn{
    flex:none;position:relative;width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;
    transition:background .2s ease,transform .2s ease,border-color .2s ease;
  }
  .copy-btn:hover{background:rgba(255,255,255,.22);transform:scale(1.08)}
  .copy-btn:focus-visible{outline:2px solid var(--c3);outline-offset:2px}
  .copy-btn svg{width:16px;height:16px}
  .copy-btn .ic-check{display:none;color:#2ee06f}
  .copy-btn.copied{border-color:rgba(46,224,111,.65);background:rgba(46,224,111,.16)}
  .copy-btn.copied .ic-copy{display:none}
  .copy-btn.copied .ic-check{display:block}

  /* aviso "copiado" no centro da tela */
  #copyToast{
    position:fixed;left:50%;bottom:28px;z-index:10;
    transform:translateX(-50%) translateY(12px);
    background:rgba(16,20,34,.92);border:1px solid rgba(255,255,255,.18);color:#fff;
    padding:10px 18px;border-radius:999px;font-size:.85rem;font-weight:600;
    opacity:0;pointer-events:none;backdrop-filter:blur(10px);
    box-shadow:0 10px 30px rgba(0,0,0,.5);
    transition:opacity .25s ease,transform .25s ease;
  }
  #copyToast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #copyToast .ok{color:#2ee06f}

  footer{margin-top:34px;text-align:center;font-size:.8rem;color:rgba(255,255,255,.4)}

  /* ripple nos botões */
  .ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:ripple .6s ease-out;pointer-events:none}
  @keyframes ripple{to{transform:scale(1.8);opacity:0}}

  @media (max-width:420px){
    .container{padding:44px 16px 30px}
    h1{font-size:1.25rem}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .rise{opacity:1}
  }
</style>
</head>

  <script>
    (function () {
      var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      /* ============ AJUSTES DO CÉU ============ */
      var STAR_COUNT = 160;    // quantidade de estrelas
      var PARALLAX_PX = 26;    // intensidade do parallax (movimento das estrelas)
      var RIPPLE_SPEED = 3.4;  // velocidade de expansão da gota d'água
      /* ========================================= */

      var canvas = document.getElementById('sky');
      var ctx = canvas.getContext('2d');
      var W = 0, H = 0;

      function resize() {
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = Math.round(W * dpr);
        canvas.height = Math.round(H * dpr);
        canvas.style.width = W + 'px';
        canvas.style.height = H + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      resize();
      window.addEventListener('resize', resize);

      /* ---------- 1. Estrelas (com profundidade para o parallax) ---------- */
      var STAR_COLORS = ['#ffffff', '#ffffff', '#ffffff', '#ffffff', '#cfe6ff', '#ffe9c9'];
      var stars = [];
      for (var i = 0; i < STAR_COUNT; i++) {
        stars.push({
          x: Math.random(),                       // posição normalizada (0..1)
          y: Math.random(),
          r: 0.4 + Math.random() * 1.6,           // tamanho
          depth: 0.15 + Math.random() * 0.85,     // profundidade (parallax)
          a: 0.35 + Math.random() * 0.65,         // brilho base
          sp: 0.4 + Math.random() * 1.6,          // velocidade do piscar
          ph: Math.random() * Math.PI * 2,        // fase do piscar
          c: STAR_COLORS[(Math.random() * STAR_COLORS.length) | 0]
        });
      }

      /* ---------- 2. Parallax + impulso no clique ("estrelas vão para trás") ---------- */
      var mx = 0, my = 0, tmx = 0, tmy = 0; // parallax: atual e alvo (-1..1)
      var inx = 0, iny = 0;                 // impulso do clique (decai com o tempo)

      window.addEventListener('pointermove', function (e) {
        tmx = (e.clientX / W) * 2 - 1;
        tmy = (e.clientY / H) * 2 - 1;
      });

      /* ---------- 3. Efeito de água: gota no local do clique/toque ---------- */
      var ripples = [];
      function addRipple(x, y) {
        ripples.push({ x: x, y: y, r: 4, a: 0.8 });
      }

      window.addEventListener('pointerdown', function (e) {
        if (reduced) return;
        addRipple(e.clientX, e.clientY);
        // estrelas se afastam na direção oposta do toque e voltam em seguida
        inx = -((e.clientX / W) * 2 - 1) * 1.2;
        iny = -((e.clientY / H) * 2 - 1) * 1.2;
      });

      /* ---------- 4. Estrelas cadentes ---------- */
      var shoots = [];
      function spawnShoot() {
        shoots.push({
          x: W * (0.3 + Math.random() * 0.65),
          y: H * (0.05 + Math.random() * 0.3),
          vx: -(200 + Math.random() * 140),
          vy: 120 + Math.random() * 90,
          p: 0
        });
      }
      function scheduleShoot() {
        setTimeout(function () { spawnShoot(); scheduleShoot(); }, 5000 + Math.random() * 6000);
      }
      if (!reduced) {
        setTimeout(function () { spawnShoot(); scheduleShoot(); }, 2500);
      }

      /* ---------- 5. Desenho ---------- */
      function drawAurora(time, ox, oy) {
        // aurora boreal: faixas de luz colorida ondulando no céu
        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        ctx.translate(ox * 0.4, oy * 0.4);
        var bands = [
          { c: '0,255,170',  y: 0.16, amp: 46, sp: 0.25, w: 110 }, // verde
          { c: '150,80,255', y: 0.27, amp: 60, sp: 0.18, w: 140 }, // roxo
          { c: '60,190,255', y: 0.08, amp: 34, sp: 0.35, w: 80  }  // azul
        ];
        for (var b = 0; b < bands.length; b++) {
          var bd = bands[b];
          var yBase = H * bd.y;
          var grad = ctx.createLinearGradient(0, yBase - bd.w, 0, yBase + bd.w);
          grad.addColorStop(0, 'rgba(' + bd.c + ',0)');
          grad.addColorStop(0.5, 'rgba(' + bd.c + ',0.10)');
          grad.addColorStop(1, 'rgba(' + bd.c + ',0)');
          ctx.fillStyle = grad;
          ctx.beginPath();
          var steps = 48, i, x, y;
          for (i = 0; i <= steps; i++) {
            x = (i / steps) * (W + 80) - 40;
            y = yBase
              + Math.sin(i * 0.011 + time * bd.sp + b * 2.1) * bd.amp
              + Math.sin(i * 0.005 - time * bd.sp * 0.6 + b) * bd.amp * 0.5;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          for (i = steps; i >= 0; i--) {
            x = (i / steps) * (W + 80) - 40;
            y = yBase + bd.w
              + Math.sin(i * 0.011 + time * bd.sp + b * 2.1) * bd.amp * 0.55
              + Math.sin(i * 0.005 - time * bd.sp * 0.6 + b) * bd.amp * 0.35;
            ctx.lineTo(x, y);
          }
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      function drawStars(time, ox, oy, scale) {
        ctx.save();
        ctx.translate(W / 2, H / 2);
        ctx.scale(scale, scale);
        ctx.translate(-W / 2, -H / 2);
        for (var i = 0; i < stars.length; i++) {
          var s = stars[i];
          var tw = reduced ? 1 : (0.55 + 0.45 * Math.sin(time * s.sp + s.ph));
          ctx.globalAlpha = s.a * tw;
          ctx.fillStyle = s.c;
          ctx.shadowBlur = s.r > 1.8 ? 6 : 0;
          ctx.shadowColor = 'rgba(200,225,255,0.8)';
          ctx.beginPath();
          ctx.arc(s.x * W + ox * s.depth, s.y * H + oy * s.depth, s.r, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.shadowBlur = 0;
        ctx.globalAlpha = 1;
        ctx.restore();
      }

      function drawShoots() {
        for (var i = shoots.length - 1; i >= 0; i--) {
          var sh = shoots[i];
          sh.p += 0.022;
          if (sh.p >= 1) { shoots.splice(i, 1); continue; }
          var hx = sh.x + sh.vx * sh.p;
          var hy = sh.y + sh.vy * sh.p;
          var mag = Math.sqrt(sh.vx * sh.vx + sh.vy * sh.vy);
          var tx = hx - (sh.vx / mag) * 90;
          var ty = hy - (sh.vy / mag) * 90;
          var g = ctx.createLinearGradient(hx, hy, tx, ty);
          var al = 1 - sh.p;
          g.addColorStop(0, 'rgba(255,255,255,' + al.toFixed(3) + ')');
          g.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.strokeStyle = g;
          ctx.lineWidth = 2;
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(hx, hy);
          ctx.lineTo(tx, ty);
          ctx.stroke();
        }
      }

      function drawRipples() {
        for (var i = ripples.length - 1; i >= 0; i--) {
          var rp = ripples[i];
          rp.r += RIPPLE_SPEED;
          rp.a *= 0.962;
          if (rp.a < 0.02) { ripples.splice(i, 1); continue; }
          // brilho da água
          var g = ctx.createRadialGradient(rp.x, rp.y, 0, rp.x, rp.y, rp.r * 1.5);
          g.addColorStop(0, 'rgba(150,210,255,' + (rp.a * 0.45).toFixed(3) + ')');
          g.addColorStop(1, 'rgba(150,210,255,0)');
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.arc(rp.x, rp.y, rp.r * 1.5, 0, Math.PI * 2);
          ctx.fill();
          // anel externo
          ctx.strokeStyle = 'rgba(190,225,255,' + rp.a.toFixed(3) + ')';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2);
          ctx.stroke();
          // anel interno (efeito de onda dupla)
          ctx.strokeStyle = 'rgba(190,225,255,' + (rp.a * 0.5).toFixed(3) + ')';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.arc(rp.x, rp.y, rp.r * 0.65, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      function frame(t) {
        mx += (tmx - mx) * 0.06;
        my += (tmy - my) * 0.06;
        inx *= 0.93;
        iny *= 0.93;
        var ox = (mx + inx) * PARALLAX_PX;
        var oy = (my + iny) * PARALLAX_PX;
        // leve "afundamento" do céu no clique = estrelas indo para trás
        var push = Math.min(1, (Math.abs(inx) + Math.abs(iny)) * 0.4);
        var scale = 1 - push * 0.02;

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        drawAurora((t || 0) / 1000, ox, oy);
        drawStars((t || 0) / 1000, ox, oy, scale);
        drawShoots();
        drawRipples();
        requestAnimationFrame(frame);
      }

      if (reduced) {
        // modo acessível: céu estático, sem animações
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, W, H);
        drawAurora(0, 0, 0);
        drawStars(0, 0, 0, 1);
      } else {
        requestAnimationFrame(frame);
      }

      /* ---------- 6. Ripple nos botões ---------- */
      document.querySelectorAll('.link-btn').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          var rect = this.getBoundingClientRect();
          var size = Math.max(rect.width, rect.height);
          var x = e.clientX || (rect.left + rect.width / 2);
          var y = e.clientY || (rect.top + rect.height / 2);
          var r = document.createElement('span');
          r.className = 'ripple';
          r.style.width = r.style.height = size + 'px';
          r.style.left = (x - rect.left - size / 2) + 'px';
          r.style.top = (y - rect.top - size / 2) + 'px';
          this.appendChild(r);
          setTimeout(function () { r.remove(); }, 650);
        });
      });

      /* ---------- 7. Botão de copiar o número ---------- */
      var toast = document.getElementById('copyToast');
      var toastTimer = null;
      function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (err) {}
        document.body.removeChild(ta);
      }
      document.querySelectorAll('.copy-btn').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.preventDefault();  // não deixa o clique atravessar para o link
          e.stopPropagation();
          var text = btn.getAttribute('data-copy');
          function done() {
            btn.classList.add('copied');
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () {
              btn.classList.remove('copied');
              toast.classList.remove('show');
            }, 1600);
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done, function () { fallbackCopy(text); done(); });
          } else {
            fallbackCopy(text);
            done();
          }
        });
      });
    })();
  </script>
